manifestVersion: 1
id: 4rkad-frigate
category: bitcoin
name: Frigate
version: "1.5.2-2"
tagline: Silent Payments Electrum server for Sparrow Wallet
description: >-
  Frigate is an experimental Electrum-style server that enables Silent Payments
  (BIP352) scanning for light clients like Sparrow Wallet.


  It connects to your Bitcoin Node and builds a local tweak index using DuckDB,
  then exposes Electrum-compatible methods for Silent Payments wallets to
  subscribe and scan for incoming transactions without downloading gigabytes of
  block filter data.


  Built by sparrowwallet (Craig Raw). Requires the Bitcoin Node app to be
  installed and synced. Initial indexing can take hours on mainnet (CPU-only)
  but is fast on signet/testnet.
releaseNotes: >-
  Fix Tor onion forwarding: connections to the Electrum hidden service
  on port 57001 now reach the Frigate server reliably. Previously, the
  Docker DNS alias "server" resolved to multiple containers (one per
  app with a "server" service on umbrel_main_network), so Tor
  round-robined to the wrong backend most of the time. Now pinned to
  the full container name "4rkad-frigate_server_1".


  Dashboard: keep showing the current block height even when Frigate is
  idle at chain tip (Frigate 1.5.2 stopped logging "block height N" in
  steady state). A background poller queries bitcoind every 30s and
  writes the line the dashboard regex needs.
