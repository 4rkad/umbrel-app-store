manifestVersion: 1
id: 4rkad-frigate
category: bitcoin
name: Frigate
version: "1.5.0"
tagline: Silent Payments Electrum server for Sparrow Wallet
description: >-
  Frigate is an experimental Electrum-style server that enables Silent Payments
  (BIP352) scanning for light clients like Sparrow Wallet.


  It connects to your Bitcoin Node and builds a local tweak index using DuckDB,
  then exposes Electrum-compatible methods for Silent Payments wallets to
  subscribe and scan for incoming transactions without downloading gigabytes of
  block filter data.


  Built by sparrowwallet (Craig Raw). Requires the Bitcoin Node app to be
  installed and synced. Initial indexing can take hours on mainnet (CPU-only)
  but is fast on signet/testnet.
releaseNotes: >-
  Updated to Frigate 1.5.0 (upstream release 2026-05-14). New silent payments
  subscribe protocol returns subscription identity as JSON object. ZMQ
  sequence mempool ingestion, TLS Electrum listener (sslPort), TLS backend
  support, improved scan lifecycle with cancellation and reorg restart,
  notifications no longer sent on confirmations, streaming JSON parser for
  Electrum backend notifications, DuckDB ufsecp data-race fix, and assorted
  protocol robustness improvements. Compatible with Sparrow rama sp.
