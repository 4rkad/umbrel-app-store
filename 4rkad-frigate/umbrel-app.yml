manifestVersion: 1
id: 4rkad-frigate
category: bitcoin
name: Frigate
version: "1.5.2-4"
tagline: Silent Payments Electrum server for Sparrow Wallet
description: >-
  Frigate is an experimental Electrum-style server that enables Silent Payments
  (BIP352) scanning for light clients like Sparrow Wallet.


  It connects to your Bitcoin Node and builds a local tweak index using DuckDB,
  then exposes Electrum-compatible methods for Silent Payments wallets to
  subscribe and scan for incoming transactions without downloading gigabytes of
  block filter data.


  Built by sparrowwallet (Craig Raw). Requires the Bitcoin Node app to be
  installed and synced. Initial indexing can take hours on mainnet (CPU-only)
  but is fast on signet/testnet.
releaseNotes: >-
  Fix mainnet startup: the entrypoint wrote config.toml under a
  per-network subfolder (e.g. /data/frigate/mainnet/config.toml) but
  Frigate v1.5.2 reads it from the home directory directly
  (/data/frigate/config.toml). On a fresh mainnet install Frigate
  ignored the generated config and fell back to defaults, failing to
  locate the Bitcoin Core cookie and entering a restart loop. Now the
  entrypoint writes the config straight to the home directory.


  Dashboard: show real indexing progress instead of flipping to
  "Running" while syncing. The web UI now prioritises Frigate's
  "Indexing progress: N / M blocks (P%, height H)" lines over the
  background poller's stale-timestamped lines, so during initial sync
  it correctly displays "Indexing &middot; Block H". The poller also
  skips emission while Frigate is actively indexing to avoid racing
  with the live progress logs.
