manifestVersion: 1
id: 4rkad-frigate
category: bitcoin
name: Frigate
version: "1.5.2-1"
tagline: Silent Payments Electrum server for Sparrow Wallet
description: >-
  Frigate is an experimental Electrum-style server that enables Silent Payments
  (BIP352) scanning for light clients like Sparrow Wallet.


  It connects to your Bitcoin Node and builds a local tweak index using DuckDB,
  then exposes Electrum-compatible methods for Silent Payments wallets to
  subscribe and scan for incoming transactions without downloading gigabytes of
  block filter data.


  Built by sparrowwallet (Craig Raw). Requires the Bitcoin Node app to be
  installed and synced. Initial indexing can take hours on mainnet (CPU-only)
  but is fast on signet/testnet.
releaseNotes: >-
  Dashboard now flips to "Running" immediately when the UI opens on a
  Frigate that has been idle at chain tip for more than 90 seconds,
  instead of showing "Indexing" for ~30 seconds first. Falls back to
  the previous behavior if the log timestamp can&rsquo;t be parsed.


  Includes Frigate 1.5.2 release.


  1.5.1: Faster cold sync via getblock verbosity=3 (inlined prevout
  scripts). JSON-RPC batching during initial mempool indexing. Indexed
  block progress now persisted in a separate marker table. Electrum
  transport read lock released during socket reads; per-handler write
  lock serializes client socket writes. Fix: script-hash
  subscribe/unsubscribe races.


  1.5.2: Reduce verbose protocol-related ERROR logs. Restore new block
  tip INFO log in steady state.
