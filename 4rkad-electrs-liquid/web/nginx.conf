server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://4rkad-electrs-liquid_electrs_1:3000/;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache";
    }
}
