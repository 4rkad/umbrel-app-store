manifestVersion: 1
id: 4rkad-electrs-liquid
category: bitcoin
name: Electrs Liquid
version: "0.4.9"
tagline: Personal Electrum server for the Liquid Network
description: >-
  Run your personal Electrum server for the Liquid Network and connect your
  wallet to it instead of relying on Blockstream's public servers.


  Without your own server, your wallet queries Blockstream's infrastructure
  to check balances and transactions — leaking which addresses are yours.
  Even though Liquid uses Confidential Transactions (hidden amounts and assets),
  the transaction graph is still visible. Input ownership heuristics still apply,
  and swaps used to enter/exit Liquid can correlate amounts, origin, and destination.


  With Electrs Liquid, all wallet queries stay local. Nobody can build a profile
  of your Liquid activity.


  Requires the Elements Core app to be installed and synced.
releaseNotes: >-
  Use --jsonrpc-import for reliable RPC-based indexing.
  Added verbose logging for sync visibility.
  Live sync status from electrs HTTP API.
