version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: 4rkad-electrs-liquid_web_1
      APP_PORT: 8080

  web:
    image: nginx:1.27-alpine
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/web/index.html:/usr/share/nginx/html/index.html:ro
      - ${APP_DATA_DIR}/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${APP_DATA_DIR}/icon.svg:/usr/share/nginx/html/icon.svg:ro
      - ${TOR_DATA_DIR}/app-${APP_ID}/main/hostname:/run/tor-hostname:ro

  electrs:
    image: ghcr.io/4rkad/electrs-liquid:latest
    restart: on-failure
    stop_grace_period: 30s
    user: "1000:1000"
    volumes:
      - "${APP_DATA_DIR}/data/electrs:/data"
    command:
      - -v
      - --network
      - liquid
      - --daemon-rpc-addr
      - "elements_node_1:7041"
      - --cookie
      - "elements:${APP_ELECTRS_LIQUID_ELEMENTS_RPC_PASS}"
      - --electrum-rpc-addr
      - "0.0.0.0:60601"
      - --http-addr
      - "0.0.0.0:3000"
      - --jsonrpc-import
      - --db-dir
      - /data/db

  tor:
    image: getumbrel/tor:0.4.7.8@sha256:2ace83f22501f58857fa9b403009f595137fa2e7986c4fda79d82a8119072b6a
    user: "1000:1000"
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/torrc:/etc/tor/torrc:ro
      - ${TOR_DATA_DIR}:/data
    environment:
      HOME: "/tmp"
