id: 4rkad-labelbase
category: bitcoin
name: Labelbase
version: "2.3.0-4rkad.12"
tagline: Self-hosted BIP-329 label management for Bitcoin wallets
description: >-
  Labelbase is a self-hosted label management service for Bitcoin transactions,
  addresses, outputs, inputs, xpubs and pubkeys.


  It implements BIP-329 (Wallet Labels Export Format), so labels are portable
  across compatible wallets like Sparrow, Specter and Nunchuk.


  Version 2.3.0 highlights:

  - Full BIP-329 extended fields (height, time, fee, value, rate, keypath, fmv).

  - Currency Sync — convert legacy currency annotations into structured FMV.

  - Auto-Fill missing data from blockchain.

  - UTXO Health Monitoring (VTER) — color-coded fee efficiency treemap.

  - Type filter tabs (Transactions, Outputs, Inputs, Addresses, Pubkeys, XPubs).


  All label data is encrypted at rest in the local MySQL database. Nothing
  leaves your node.
releaseNotes: >-
  - Dark-mode readability fix: the sidebar links, the profile
    dropdown menu (Profile Settings, Account Security, ...) and the
    Privacy Policy / Terms links all had a hardcoded dark text color,
    so they disappeared on a dark background. They now use the
    Bootstrap theme-aware color variables and stay readable in both
    modes.

  - Encrypted BIP-329 import now works. Upstream had the option
    commented out and the decrypt branch stubbed as TODO, so the
    .7z files the export modal produces could not be re-imported.
    The importer now accepts "BIP-329 (encrypted) .7z", asks for
    the passphrase, and returns a clear error if the passphrase
    is wrong.

  - Dark-mode polish: sidebar now follows the selected theme (was stuck
    white because it used bg-light instead of bg-body-tertiary), and a
    light/dark/auto theme switcher was added to the navbar. The
    underlying switcher JS was already present upstream but the button
    was missing, so the theme only followed the OS preference.

  - Fix: the "Encrypt" option in the BIP-329 export modal now works.
    Two modals on the same page both rendered a field with
    id="id_passphrase", so toggling Encrypt enabled the wrong (hidden)
    input. The export passphrase field stayed greyed out and the file
    was downloaded as plaintext. The export form now uses unique IDs.

  - Fix: the Tree Map sidebar link now honors the Profile → Extensions
    → Tree Map toggle. Previously the link was always shown even when
    the extension was disabled.

  - Fix: canonical xpub/tpub (as exported by Bitcoin Core, Sparrow
    default, Specter) now derives addresses correctly for BIP-49 and
    BIP-84. Previously the address table appeared empty without error
    unless the key was pre-converted to ypub/zpub/upub/vpub.

  - Sentry error tracking is OFF by default. Existing profiles with
    Sentry still enabled are migrated to off on first boot. Re-enable
    any time from Profile → Privacy.

  - Profile defaults use friendly hostnames (electrs.umbrel,
    umbrel.local) so mempool links work from the browser.

  - Multi-arch image — Raspberry Pi (arm64) supported.

  - Auto-configure Electrum and mempool endpoints to your own Umbrel
    Electrs and Mempool apps.

  - Fix label import (MEDIA_ROOT and writable /app).

  - Wait for MySQL to be healthy before starting Django.
