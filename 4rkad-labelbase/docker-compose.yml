services:

  app_proxy:
    environment:
      APP_HOST: 4rkad-labelbase_web_1
      APP_PORT: 8080

  mysql:
    image: mysql:8.0.36
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    environment:
      MYSQL_DATABASE: labelbase
      MYSQL_USER: ulabelbase
      MYSQL_PASSWORD: ${APP_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${APP_MYSQL_ROOT_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/mysql:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${APP_MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  django:
    image: ghcr.io/4rkad/labelbase-django:2.3.0-4rkad.8
    user: "1000:1000"
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
    extra_hosts:
      - "electrs.umbrel:${APP_ELECTRS_NODE_IP}"
      - "umbrel.local:${APP_MEMPOOL_IP}"
    environment:
      MYSQL_HOST: 4rkad-labelbase_mysql_1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: labelbase
      MYSQL_USER: ulabelbase
      MYSQL_PASSWORD: ${APP_MYSQL_PASSWORD}
      UMBREL_ELECTRUM_HOSTNAME: "electrs.umbrel"
      UMBREL_ELECTRUM_PORTS: "t50001"
      UMBREL_MEMPOOL_ENDPOINT: "http://umbrel.local:${APP_MEMPOOL_PORT}"
    volumes:
      - ${APP_DATA_DIR}/data/config.ini:/app/config.ini
      - ${APP_DATA_DIR}/data/labelbase.log:/app/labelbase.log
      - ${APP_DATA_DIR}/data/static:/app/static
      - ${APP_DATA_DIR}/data/media:/app/media
    command: /app/run.sh
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8000/',timeout=3); sys.exit(0 if r.status in (200,301,302,403) else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  web:
    image: nginx:1.27-alpine
    restart: on-failure
    depends_on:
      django:
        condition: service_healthy
    volumes:
      - ${APP_DATA_DIR}/data/static:/app/static:ro
      - ${APP_DATA_DIR}/data/media:/app/media:ro
      - ${APP_DATA_DIR}/data/nginx.conf:/etc/nginx/nginx.conf:ro
